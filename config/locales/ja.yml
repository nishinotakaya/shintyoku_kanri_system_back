# 既定ロケールは :ja だが日本語の辞書が無く、バリデーション失敗が
# 「Translation missing: ja.activerecord.errors.messages.record_invalid」として
# 画面に出ていた。原因が読めないので、最低限のエラー文言をここに置く。
ja:
  errors:
    format: "%{attribute} %{message}"
    messages:
      blank: を入力してください
      present: は入力しないでください
      taken: はすでに使われています
      invalid: は不正な値です
      confirmation: が %{attribute} と一致しません
      accepted: を受諾してください
      inclusion: は一覧にありません
      exclusion: は予約されています
      too_long: は %{count} 文字以内で入力してください
      too_short: は %{count} 文字以上で入力してください
      wrong_length: は %{count} 文字で入力してください
      not_a_number: は数値で入力してください
      not_an_integer: は整数で入力してください
      greater_than: は %{count} より大きい値にしてください
      greater_than_or_equal_to: は %{count} 以上の値にしてください
      less_than: は %{count} より小さい値にしてください
      less_than_or_equal_to: は %{count} 以下の値にしてください
      equal_to: は %{count} にしてください
      other_than: は %{count} 以外の値にしてください
      odd: は奇数にしてください
      even: は偶数にしてください
      required: を入力してください
      taken_in_past: はすでに使われています
  activerecord:
    errors:
      messages:
        record_invalid: "保存できませんでした: %{errors}"
        restrict_dependent_destroy:
          has_one: "%{record} が存在するため削除できません"
          has_many: "%{record} が存在するため削除できません"
    attributes:
      user:
        email: メールアドレス
        display_name: 表示名
        password: パスワード
        password_confirmation: パスワード（確認）
        work_categories: 勤怠カテゴリ
        closing_day: 締日
